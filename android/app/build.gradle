plugins {
    id 'com.android.application'
}

// The region: -Pmhfu.region=US builds the USA game from setup.ps1's work/us
// (the ULUS10391 EBOOT) as its own app (com.pateeerq.mhfu.us), which can sit
// next to the Europe one. Without it: Europe, from work/.
def mhfuRegion = (project.findProperty('mhfu.region') ?: 'EU').toString().toUpperCase()
def mhfuUs = mhfuRegion == 'US'
def mhfuWork = new File(rootDir, mhfuUs ? '../work/us' : '../work').canonicalPath.replace('\\', '/')

android {
    namespace 'com.pateeerq.mhfu'
    compileSdk 35
    // The NDK Android Studio installed (SDK Manager > SDK Tools > NDK).
    ndkVersion project.findProperty('mhfu.ndkVersion') ?: '27.0.12077973'

    defaultConfig {
        applicationId 'com.pateeerq.mhfu'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '0.3.2'
        if (mhfuUs) applicationIdSuffix '.us'
        // What the Java side checks the player's files against (host/region.h has the same).
        buildConfigField 'String', 'GAME_ID', mhfuUs ? '"ULUS10391"' : '"ULES01213"'
        buildConfigField 'String', 'GAME_ID_DASH', mhfuUs ? '"ULUS-10391"' : '"ULES-01213"'
        buildConfigField 'String', 'REGION_NAME', mhfuUs ? '"USA"' : '"Europe"'
        buildConfigField 'String', 'REGION_TAG', mhfuUs ? '"US"' : '"EU"'
        buildConfigField 'long', 'EBOOT_SIZE', mhfuUs ? '1910672L' : '1910384L'
        resValue 'string', 'app_name', mhfuUs ? 'Monster Hunter: Freedom Unite Recomp (USA)' : 'Monster Hunter: Freedom Unite Recomp'
        externalNativeBuild {
            cmake {
                // The repository's CMakeLists.txt: SDL3 static inside libmain.so,
                // no launcher (the Android one comes later), the SDL window.
                arguments '-DANDROID_STL=c++_static', '-DMHFU_LAUNCHER=OFF', '-DMHFU_SDL_WINDOW=ON',
                          '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON',
                          "-DMHFU_GEN_DIR=${mhfuWork}/gen", "-DMHFU_OVL_DIR=${mhfuWork}/gen_ovl"
                // Optimised even in debug builds: an unoptimised recompiled game is too slow to try.
                cFlags '-O2'
                targets 'mhfu_host'
            }
        }
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Signed with the debug key for now: this APK is for your own phone only.
            signingConfig signingConfigs.debug
        }
    }

    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
            version '3.22.1+'
        }
    }

    buildFeatures {
        buildConfig true
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    lint {
        abortOnError false
        // Lint's worker crashes on this project (a recompiled game is a lot of C); skip it in release builds.
        checkReleaseBuilds false
    }
}
