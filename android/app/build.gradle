plugins {
    id 'com.android.application'
}

// The region: -Pmhfu.region=US builds the USA game from setup.ps1's work/us
// (the ULUS10391 EBOOT) as its own app (com.pateeerq.mhfu.us), which can sit
// next to the Europe one; -Pmhfu.region=JP the Japanese Monster Hunter Portable
// 2nd G (ULJM05500, work/jp, com.pateeerq.mhfu.jp). Without it: Europe, from work/.
def mhfuRegion = (project.findProperty('mhfu.region') ?: 'EU').toString().toUpperCase()
def mhfuUs = mhfuRegion == 'US'
def mhfuFuc = mhfuRegion == 'FUC'                // FUComplete, the English MHP2G disc (work/fuc)
def mhfuJp = mhfuRegion == 'JP' || mhfuFuc       // the same code as JP
def mhfuSub = mhfuUs ? 'us' : mhfuFuc ? 'fuc' : mhfuJp ? 'jp' : ''
def mhfuWork = new File(rootDir, mhfuSub ? "../work/${mhfuSub}" : '../work').canonicalPath.replace('\\', '/')
def mhfuIds = [EU: ['ULES01213', 'ULES-01213', 'Europe', '1910384L', 'Monster Hunter: Freedom Unite Recomp'],
               US: ['ULUS10391', 'ULUS-10391', 'USA', '1910672L', 'Monster Hunter: Freedom Unite Recomp (USA)'],
               JP: ['ULJM05500', 'ULJM-05500', 'Japan', '1890112L', 'Monster Hunter Portable 2nd G Recomp'],
               FUC: ['ULJM05500', 'ULJM-05500', 'FUComplete', '1889772L', 'Monster Hunter Freedom Unite Complete Recomp']][mhfuRegion]

android {
    namespace 'com.pateeerq.mhfu'
    compileSdk 35
    // The NDK Android Studio installed (SDK Manager > SDK Tools > NDK).
    ndkVersion project.findProperty('mhfu.ndkVersion') ?: '27.0.12077973'

    defaultConfig {
        applicationId 'com.pateeerq.mhfu'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '0.3.2'
        if (mhfuSub) applicationIdSuffix ".${mhfuSub}"
        // What the Java side checks the player's files against (host/region.h has the same).
        buildConfigField 'String', 'GAME_ID', "\"${mhfuIds[0]}\""
        buildConfigField 'String', 'GAME_ID_DASH', "\"${mhfuIds[1]}\""
        buildConfigField 'String', 'REGION_NAME', "\"${mhfuIds[2]}\""
        buildConfigField 'String', 'REGION_TAG', "\"${mhfuRegion}\""
        buildConfigField 'long', 'EBOOT_SIZE', mhfuIds[3]
        // CWCheat offset where the EBOOT's code ends (host/region.h MHFU_EBOOT_CODE_END).
        buildConfigField 'int', 'EBOOT_CODE_END', mhfuJp ? '0x10C1F0' : mhfuUs ? '0x10E7D8' : '0x10E6B8'
        buildConfigField 'String', 'GAME_TITLE', mhfuFuc ? '"Monster Hunter Portable 2nd G FUComplete"' : mhfuJp ? '"Monster Hunter Portable 2nd G"' : '"Monster Hunter Freedom Unite"'
        // FUComplete: the EBOOT is taken from the disc (SetupActivity.ebootFromDisc).
        buildConfigField 'boolean', 'EBOOT_ON_DISC', mhfuFuc ? 'true' : 'false'
        resValue 'string', 'app_name', mhfuIds[4]
        externalNativeBuild {
            cmake {
                // The repository's CMakeLists.txt: SDL3 static inside libmain.so,
                // no launcher (the Android one comes later), the SDL window.
                arguments '-DANDROID_STL=c++_static', '-DMHFU_LAUNCHER=OFF', '-DMHFU_SDL_WINDOW=ON',
                          '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON',
                          "-DMHFU_GEN_DIR=${mhfuWork}/gen", "-DMHFU_OVL_DIR=${mhfuWork}/gen_ovl"
                // Optimised even in debug builds: an unoptimised recompiled game is too slow to try.
                cFlags '-O2'
                targets 'mhfu_host'
            }
        }
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Signed with the debug key for now: this APK is for your own phone only.
            signingConfig signingConfigs.debug
        }
    }

    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
            version '3.22.1+'
        }
    }

    buildFeatures {
        buildConfig true
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    lint {
        abortOnError false
        // Lint's worker crashes on this project (a recompiled game is a lot of C); skip it in release builds.
        checkReleaseBuilds false
    }
}
